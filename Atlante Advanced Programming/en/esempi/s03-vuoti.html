<header class="testa">
  <div class="occhiello"><span>Examples · lists and Option</span></div>
  <h1>Examples: Nil, None, null in Scala</h1>
  <p class="lede">The code of the <a href="../teoria/s03-vuoti.html">theory page</a>: a file that compiles and runs. Checked with Scala 3.8.4 and the course options (<code>-Werror</code>, <code>-source:future</code>).</p>
</header>

<section>
  <h2>The whole file</h2>
  <p>Run it with <code>scala-cli run NilNone.scala</code>.</p>
  <figure class="codice" data-titolo="NilNone.scala">
<pre data-lang="scala">//&gt; using scala 3.8.4
//&gt; using options -Werror -deprecation -feature -source:future

val lista: List[Int] = 1 :: 2 :: Nil
val vuota: List[Int] = Nil

val trovato: Option[Int] = Some(3)
val niente: Option[Int] = None

def primoOpzione(xs: List[Int]): Option[Int] = xs match
  case Nil =&gt; None
  case h :: _ =&gt; Some(h)

@main def esempiNilNone(): Unit =
  println(lista)
  println(vuota.isEmpty)
  println(Nil == List())
  println(primoOpzione(lista))
  println(primoOpzione(vuota))
  println(trovato.getOrElse(0))
  println(niente.getOrElse(0))
  println(Option(null: String))
  println(Option("ciao"))
  println(None == null)
  val testo: String = null
  println(testo == null)
  try
    println(testo.length)
  catch
    case e: NullPointerException =&gt; println("NPE su null")</pre>
    <ol class="spiega">
      <li data-righe="1-2"><p>Directives for <code>scala-cli</code>: Scala version and checks. <code>-Werror</code> turns warnings into errors.</p></li>
      <li data-righe="4" data-segna="1 :: 2 :: Nil@ora"><p>List built with <code>::</code> (adds at the front) and closed by <code>Nil</code>, the empty list. The printed result is <code>List(1, 2)</code>.</p></li>
      <li data-righe="5" data-segna="val vuota: List[Int] = Nil@ora"><p>List with no elements: <code>Nil</code> is a valid list, and <code>isEmpty</code> says <code>true</code>.</p></li>
      <li data-righe="7-8" data-segna="None@ora"><p>Two <code>Option</code>s: <code>Some(3)</code> has a value, <code>None</code> says there is nothing.</p></li>
      <li data-righe="10-12" data-segna="case Nil =&gt; None@ora"><p>Function that may have no result. The pattern <code>Nil</code> recognises the empty list and returns <code>None</code>, instead of an invented value.</p></li>
      <li data-righe="14-16" data-segna="vuota.isEmpty@ora"><p><code>Nil</code> is a list: <code>isEmpty</code> and <code>==</code> work as for any list.</p></li>
      <li data-righe="18-19" data-segna="primoOpzione(vuota)@ora"><p>With a non-empty list it gives <code>Some(1)</code>, with <code>Nil</code> it gives <code>None</code>: the caller must handle both cases.</p></li>
      <li data-righe="20-21" data-segna="getOrElse(0)@ora"><p><code>getOrElse</code> gives the value inside <code>Some</code>, or the fallback if it is <code>None</code>.</p></li>
      <li data-righe="22" data-segna="Option(null: String)@ora"><p><code>Option(x)</code> converts <code>null</code> into <code>None</code>: the safe way to bring a Java value into Scala.</p></li>
      <li data-righe="23" data-segna="Option(&quot;ciao&quot;)@ora"><p>A non-null value becomes <code>Some(ciao)</code>.</p></li>
      <li data-righe="24" data-segna="None == null@no"><p>They are different values: the comparison gives <code>false</code>. Do not confuse the two ways of saying nothing.</p></li>
      <li data-righe="25-26" data-segna="val testo: String = null@no"><p>The compiler accepts <code>null</code> as a <code>String</code>. The risk is using it: the comparison with <code>null</code> gives <code>true</code>.</p></li>
      <li data-righe="27-30" data-segna="testo.length@no"><p>Asking a <code>null</code> for <code>.length</code> throws <code>NullPointerException</code>: that is why one converts to <code>Option</code> straight away.</p></li>
    </ol>
  </figure>
</section>

<section>
  <h2>The output</h2>
  <figure class="codice" data-titolo="Output of the run">
<pre data-lang="text">1
List(1, 2)
true
true
Some(1)
None
3
0
None
Some(ciao)
false
true
NPE su null</pre>
    <ol class="spiega">
      <li data-righe="1"><p>The list built with <code>::</code> and closed by <code>Nil</code>.</p></li>
      <li data-righe="2-3"><p><code>Nil</code> is empty and equal to <code>List()</code>.</p></li>
      <li data-righe="4-5"><p>The function with <code>Nil</code> as input gives <code>None</code>.</p></li>
      <li data-righe="6-7"><p><code>getOrElse</code> chooses the value or the fallback: <code>3</code> and <code>0</code>.</p></li>
      <li data-righe="8-9"><p><code>Option(null)</code> gives <code>None</code>, <code>Option("ciao")</code> gives <code>Some(ciao)</code>.</p></li>
      <li data-righe="10"><p>The comparison between <code>None</code> and <code>null</code> gives <code>false</code>.</p></li>
      <li data-righe="11-12"><p><code>testo == null</code> gives <code>true</code>; the <code>NullPointerException</code> is caught by the <code>try</code>.</p></li>
    </ol>
  </figure>
</section>
